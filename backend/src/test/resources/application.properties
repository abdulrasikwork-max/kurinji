# Test configuration. Replaces src/main/resources/application.properties while tests run.
# Everything here is a throwaway TEST value, never a real credential.

# In-memory H2 database in MySQL-compatibility mode: tests need no MySQL server.
spring.datasource.url=jdbc:h2:mem:safesphere-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway (MySQL-specific SQL) is skipped; Hibernate builds the tables from the entity instead.
# The real MySQL migration is verified separately (see docs/PHASE2.md).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-that-is-at-least-32-bytes-long
# URL-shaped on purpose (Spring Security reads "iss" as a URL). The .example domain is reserved and never resolves.
app.jwt.issuer=https://safesphere.example
app.jwt.expiration=1h
app.cors.allowed-origins=

# Phase 6: no publication delay and no new-account probation by default, so tests see their own data at once.
# CommunityDelayApiIntegrationTest turns both back on. The purge job is called directly by the tests.
app.community.publish-delay-min=0s
app.community.publish-delay-max=0s
app.community.new-account-probation=0s
app.community.purge-enabled=false

# Phase 7: every test registers its accounts from 127.0.0.1 through MockMvc, so the per-address limits are lifted
# here; AuthThrottleApiIntegrationTest and the burst test turn the real values back on with their own properties.
app.auth.registrations-per-address=100000
app.auth.login-failures-per-address=100000
app.community.writes-per-10-minutes=100000

# Phase 9C: the coordination check runs on every (directly called) clean-up, in its real default mode SHADOW;
# CoordinationApiIntegrationTest switches it to ACTIVE.
app.moderation.coordination.interval=0s
# Phase 9D: the rules-2 shadow comparison likewise runs whenever a test calls it, in its real default mode SHADOW.
app.intelligence.rules-2-shadow-interval=0s

# Phase 10A: the account deletion job is called directly by the tests (AccountLifecycleApiIntegrationTest).
app.account.deletion-job-enabled=false

# Phase 13B: photos go to a throwaway folder; the clean-up job is called directly by the tests. The exact-place delay
# keeps its real 1-3 h (tests that need it move the shared MutableClock).
app.social.media-dir=target/test-social-media
app.social.media-cleanup-enabled=false
# 25 (not 20) so a list test can make more than one page of 20; the limit test uses this value.
app.social.posts-per-day=25
# Phase 13D: no new-account probation by default (every test account is minutes old); ProbationApiIntegrationTest
# turns the real 72 h back on. The content-moderation upkeep is called directly by the tests.
app.social.probation=0s
app.moderation.content-interval=P3650D
# Phase 13E: the automatic check is OFF in tests (no service, no key); AssessmentIntegrationTest turns it on against
# a stub service on its own H2 database. The job is called directly.
app.moderation.ai.enabled=false
app.moderation.ai.key=
app.moderation.ai.job-interval=P3650D

# V25: no SMTP in tests (the not-configured mailer); EmailVerificationApiIntegrationTest captures messages with its own
# mailer. Test accounts are marked verified by TestAccounts. The clean-up job is called directly.
app.otp.cleanup-interval=P3650D
app.otp.dev-file=target/test-otp-codes.txt
app.otp.secret=test-otp-secret-not-a-real-key-0123456789
app.otp.starts-per-address=100000
app.otp.verify-failures-per-address=100000
app.otp.sends-per-number-per-day=100000

# Phase 5: evidence files go to a throwaway folder; the vault key below is a TEST-ONLY key pair whose private half
# is src/test/resources/test-vault-private-key.TEST-ONLY.txt (never used outside the tests).
app.evidence.storage-dir=target/test-evidence-store
app.evidence.chunk-bytes=4096
app.evidence.max-item-bytes=1048576
app.evidence.user-quota-bytes=3145728
app.evidence.vault-public-
