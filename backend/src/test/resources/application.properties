# Test configuration. Replaces src/main/resources/application.properties while tests run.
# Everything here is a throwaway TEST value, never a real credential.

# In-memory H2 database in MySQL-compatibility mode: tests need no MySQL server.
spring.datasource.url=jdbc:h2:mem:safesphere-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway (MySQL-specific SQL) is skipped; Hibernate builds the tables from the entity instead.
# The real MySQL migration is verified separately (see docs/PHASE2.md).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-that-is-at-least-32-bytes-long
# URL-shaped on purpose (Spring Security reads "iss" as a URL). The .example domain is reserved and never resolves.
app.jwt.issuer=https://safesphere.example
app.jwt.expiration=1h
app.cors.allowed-origins=

# Phase 7: every test registers its accounts from 127.0.0.1 through MockMvc, so the per-address limits are lifted
# here; AuthThrottleApiIntegrationTest turns the real values back on with its own properties.
app.auth.registrations-per-address=100000

# Phase 10A: the account deletion job is called directly by the tests (AccountLifecycleApiIntegrationTest).
app.account.deletion-job-enabled=false

# Photos go to a throwaway folder; the clean-up job is called directly by the tests.
app.social.media-dir=target/test-social-media
app.social.media-cleanup-enabled=false
# The content-moderation upkeep is called directly by the tests.
app.moderation.content-interval=P3650D
# Phase 13E: the automatic check is OFF in tests (no service, no key); AssessmentIntegrationTest turns it on against
# a stub service on its own H2 database. The job is called directly.
app.moderation.ai.enabled=false
app.moderation.ai.key=
app.moderation.ai.job-interval=P3650D

# V25: no SMTP in tests (the not-configured mailer); EmailVerificationApiIntegrationTest captures messages with its own
# mailer. Test accounts are marked verified by TestAccounts. The clean-up job is called directly.
app.otp.cleanup-interval=P3650D
app.otp.dev-file=target/test-otp-codes.txt
app.otp.secret=test-otp-secret-not-a-real-key-0123456789
app.otp.starts-per-address=100000
app.otp.verify-failures-per-address=100000
app.otp.sends-per-number-per-day=100000

# Phase N3: a fixed test key, a throwaway ID-photo folder; the upkeep job is called directly by the tests. The MIET row
# (written by V34 in MySQL) comes from data.sql here, after Hibernate made the tables.
app.community.secret=test-community-secret-not-a-real-key-0123
app.community.photo-dir=target/test-id-photos
app.community.job-enabled=false
app.community.requests-per-day=100000
spring.jpa.defer-datasource-initialization=true

# Phase N4: every test account was verified minutes ago, so it is a new member (3 moments a day); the limits are lifted
# here and MomentLimitsApiTest turns the real values back on.
app.moments.per-day=100000
app.moments.new-member-per-day=100000
app.moments.today-reads-per-hour=100000
app.moments.photos-per-day=100000
# N5: every test account is a new member; the real limits are tested in their own class.
app.responses.signals-per-day=100000
app.responses.asks-per-day=100000
app.responses.new-member-asks-per-day=100000
app.responses.replies-per-day=100000
app.responses.new-member-replies-per-day=100000
app.responses.messages-per-day=100000
app.responses.messages-per-minute=100000
app.responses.replies-reads-per-hour=100000

# Phase N6: the alert queue never runs by itself in tests (AlertDispatcher.runOnce is called directly); a throwaway dev
# file and a fixed test key; the limits are lifted and the alert tests turn the real ones back on where they test them.
app.alerts.job-enabled=false
app.alerts.dev-file=target/test-alerts.txt
app.alerts.secret=test-alert-secret-not-a-real-key-0123456789
app.alerts.rounds-per-person=100000
app.alerts.per-number=100000
app.alerts.server-wide=100000
