# =====================================================================================
# SafeSphere backend configuration
#
# NOTHING SECRET IS STORED IN THIS FILE. Secrets come from environment variables
# (or from a git-ignored backend/.env file, see .env.example).
#
#   DB_URL        optional   JDBC URL of the MySQL database
#   DB_USERNAME   optional   MySQL user name (default: safesphere)
#   DB_PASSWORD   REQUIRED   MySQL password for that user
#   JWT_SECRET    REQUIRED   at least 32 characters; signs the login tokens
#   JWT_EXPIRATION optional  how long a token lives (default: 24h)
#   PORT          optional   HTTP port (default: 8080)
# =====================================================================================
spring.application.name=safesphere-backend
server.port=${PORT:8080}

# Reads KEY=VALUE lines from backend/.env if that file exists (handy on Windows). Real environment
# variables always work too, and the file is optional.
spring.config.import=optional:file:./.env[.properties]

# ---- MySQL -----------------------------------------------------------------------
# useSSL=false is for LOCAL development only. Use TLS to a managed database in production.
# connectionTimeZone=UTC (+ forceConnectionTimeZoneToSession) makes the driver and the MySQL session use UTC. Together with
# UtcTimeZone.install() in main() every DATETIME holds true UTC (docs/TIMESTAMPS.md). A custom DB_URL should keep it.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safesphere?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:safesphere}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate -------------------------------------------------------------
# Flyway owns the schema, so Hibernate must not create or change tables.
spring.jpa.hibernate.ddl-auto=none
# Do not keep a database session open while the response is rendered (avoids hidden lazy queries).
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Flyway (database migrations) ------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT -------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
# URL-shaped on purpose (Spring Security reads "iss" as a URL). The .example domain is reserved and never resolves.
app.jwt.issuer=https://safesphere.example
app.jwt.expiration=${JWT_EXPIRATION:24h}

# ---- CORS ------------------------------------------------------------------------
# The Android app is not a browser, so it never needs CORS. Leave this empty unless a browser-based
# client is added later (comma-separated origins, for example http://localhost:5173).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---- Emergency locations (Phase 4A) ---------------------------------------------
# Most points one emergency may store, how long after it ends the phone may still upload points it
# recorded while it was active, and how far the phone's clock may be off from the server's.
app.emergency.locations.max-per-emergency=${EMERGENCY_LOCATION_LIMIT:1000}
app.emergency.locations.upload-grace=15m
app.emergency.locations.clock-tolerance=5m

# ---- Moderation (Phase 7 roles and audit log; content cases since 13D) ----------
# Closed cases are kept 90 days, the audit log 365 days.
app.moderation.closed-case-retention=90d
app.moderation.audit-retention=365d
app.moderation.moderator-requests-per-hour=600
app.moderation.page-size=50
# ---- Automatic content check (Phase 13E, docs/PHASE13E_PLAN.md) ------------------------------------------------
# Evidence from the internal moderation service (moderation-service/, Python, standard library only), a tested
# DecisionPolicy decides; only humans restrict people. ON only with a key of 16+ characters (env or backend/.env);
# without one, posts publish unchecked and the start-up log says so. Service down = publish (new accounts wait <= 2 h).
app.moderation.ai.enabled=${MODERATION_AI_ENABLED:true}
app.moderation.ai.url=${MODERATION_SERVICE_URL:http://127.0.0.1:8091}
app.moderation.ai.key=${MODERATION_SERVICE_KEY:}
app.moderation.ai.connect-timeout=300ms
app.moderation.ai.timeout=1500ms
app.moderation.ai.model-mode=OFF
app.moderation.ai.probation-wait-max=2h
app.moderation.ai.retry-for=24h
app.moderation.ai.retention=90d
app.moderation.ai.job-interval=PT5M

# ---- Sign-up abuse limit (Phase 7; the password sign-in limits left in N2) ---------
# New accounts per network address, in memory only (no address is stored). The network address is the TCP peer;
# behind a reverse proxy configure server.forward-headers-strategy for a TRUSTED proxy only.
app.auth.registrations-per-address=10
app.auth.registration-window=1h

# ---- Account security and deletion (Phase 10A, docs/PHASE10.md) ----------------
# N2: deletion request, deletion cancel, signing out the other phones and ending an SOS from another sign-in need a
# fresh code texted to the account's number: 5 wrong ones per 15 min per account -> 429 (in memory). A deletion request
# waits 7 days (cancellable with a code; signing in does not cancel), is refused
# while an emergency is active or within 24 h after one, and the deletion itself also waits 24 h after any emergency.
# The deletion job runs every 15 minutes and removes the photo files before the rows.
app.account.code-failures=5
app.account.code-failure-window=15m
app.account.deletion-grace=7d
app.account.deletion-protection=24h
app.account.deletion-batch=20
app.account.deletion-interval=PT15M
# Phase 10A.4: a sign-in may renew its 24 h token without a new code for 30 days after the code was entered;
# during an SOS or Safe Walk always (a long emergency never loses its server connection to an expiring token).
app.account.session-max-age=30d
# Phase 11 C1 (docs/PHASE11.md §5): each sign-in is a device session with a refresh secret that rotates on every use.
# The phone can get a new access token after any idle time up to refresh-idle-timeout (sliding), so an SOS on a phone
# not opened for weeks still reaches the server. A replaced secret shown again within refresh-reuse-grace is a lost
# answer (rotated once more); later it ends the session (reuse). Ended sessions are deleted after session-retention.
app.account.refresh-idle-timeout=90d
app.account.refresh-reuse-grace=60s
app.account.session-retention=30d

# ---- Phone sign-in (Phase 17B, V26; Phase N2, V33, docs/PHASE_N2.md) -------------
# The ONLY way in: a 6-digit code texted to the number (no e-mail, no password). The right code signs in the number's
# account, or gives a one-use sign-up ticket (app.otp.ticket-lifetime) for a number without one. Codes are random, stored
# only as an HMAC (key: OTP_SECRET, else derived from JWT_SECRET), never logged.
# OTP_PROVIDER: DEV_FILE (default: codes are written to OTP_DEV_FILE on this computer, nothing is sent) or FAST2SMS
# (needs FAST2SMS_API_KEY; Indian mobile numbers; sends through Fast2SMS Quick SMS, route=q, about Rs 7 per SMS, no DLT;
# the Fast2SMS account needs a first Rs 100 top-up and balance).
# NOTHING SECRET HERE: every secret comes from the environment or the git-ignored backend/.env.
app.otp.provider=${OTP_PROVIDER:DEV_FILE}
app.otp.secret=${OTP_SECRET:}
app.otp.dev-file=${OTP_DEV_FILE:}
app.otp.fast2sms-api-key=${FAST2SMS_API_KEY:}
app.otp.fast2sms-url=https://www.fast2sms.com/dev/bulkV2
app.otp.code-lifetime=5m
app.otp.challenge-lifetime=30m
app.otp.max-attempts=5
app.otp.resend-cooldown=60s
app.otp.max-sends-per-challenge=5
app.otp.sends-per-number-per-day=8
app.otp.starts-per-address=30
app.otp.verify-failures-per-address=50
app.otp.address-window=1h
app.otp.ticket-lifetime=30m
app.otp.cleanup-interval=PT1H

# ---- Profiles and connections (Phase 13A, docs/PHASE13A_PLAN.md) ----------------
# Per person, in memory only (nothing about who looked up whom is stored). Look-ups are by exact handle only.
# A handle can change once per 30 days; the old one stays reserved for 30 days. Invite codes work for 7 days.
app.social.lookups-per-hour=120
app.social.handle-change-cooldown=30d
app.social.handle-reservation=30d
app.social.requests-per-day=30
app.social.max-pending-outgoing=50
app.social.max-connections=1000
app.social.invites-per-day=10
app.social.max-active-invites=5
app.social.invite-lifetime=7d
app.social.redeems-per-hour=10

# ---- Photo files (profile photos, the photos of moments) --------------------------
# Photos: <= 5 MB in, re-encoded to JPEG without metadata, stored as random file names in this folder (keep it out of
# git; back it up with the database); never served statically. A moment photo never attached goes after 24 h.
# The settings of posts, places, perspectives, Discover and video left with that code (Phase N4-B3).
app.social.media-per-day=30
app.social.media-dir=${SOCIAL_MEDIA_DIR:social-media-store}
app.social.max-media-bytes=5242880
app.social.unattached-media-lifetime=24h
app.social.media-cleanup-enabled=true
app.social.media-cleanup-interval=PT1H

# ---- Community (Phase N3, docs/PHASE_N3.md) ---------------------------------------
# COMMUNITY_SECRET (32+ random characters, kept OUT of git and backed up apart from the database): the key behind the
# roll-number and phone HMACs, the in-person code HMAC and the ID-photo encryption. Losing it breaks every ban and the
# one-account-per-roll-number rule. Empty = a development key derived from JWT_SECRET (warned; prod refuses to start).
app.community.secret=${COMMUNITY_SECRET:}
# Encrypted ID photos waiting for an admin; never served statically; deleted at the decision, withdrawal or expiry.
app.community.photo-dir=${COMMUNITY_PHOTO_DIR:id-photo-store}
app.community.code-lifetime=10m
app.community.claim-lifetime=15m
app.community.request-lifetime=7d
app.community.relink-lifetime=1h
app.community.requests-per-day=3
app.community.approvals-per-day=50
app.community.wrong-codes=10
app.community.wrong-code-window=15m
app.community.job-enabled=true
app.community.job-interval=PT1H

# ---- Time (UTC) ------------------------------------------------------------------
# At start-up the backend checks that a UTC value reaches the database unchanged and refuses to start if not.
app.time.verify-storage=true

# ---- Errors and logging ----------------------------------------------------------
# Never send exception messages or stack traces to clients. Our GlobalExceptionHandler builds the body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# ---- Moments and Today (Phase N4, docs/PHASE_N4.md) --------------------------------
# Only the abuse limits are settings (per person, in memory). The product rules (24 h of life, purge 7 days later, 6
# kept, the 7-day new-member period, 500 / 60 characters) are decisions and are constants in MomentPolicy.
app.moments.per-day=10
app.moments.new-member-per-day=3
app.moments.today-reads-per-hour=600
app.moments.questions-ahead=60
app.moments.photos-per-day=20
# Phase N5 (docs/PHASE_N5.md §3): the abuse limits of responses, in memory per person.
app.responses.signals-per-day=200
app.responses.asks-per-day=20
app.responses.new-member-asks-per-day=10
app.responses.replies-per-day=10
app.responses.new-member-replies-per-day=3
app.responses.messages-per-day=300
app.responses.messages-per-minute=10
app.responses.replies-reads-per-hour=600
