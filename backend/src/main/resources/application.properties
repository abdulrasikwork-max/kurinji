# =====================================================================================
# SafeSphere backend configuration
#
# NOTHING SECRET IS STORED IN THIS FILE. Secrets come from environment variables
# (or from a git-ignored backend/.env file, see .env.example).
#
#   DB_URL        optional   JDBC URL of the MySQL database
#   DB_USERNAME   optional   MySQL user name (default: safesphere)
#   DB_PASSWORD   REQUIRED   MySQL password for that user
#   JWT_SECRET    REQUIRED   at least 32 characters; signs the login tokens
#   JWT_EXPIRATION optional  how long a token lives (default: 24h)
#   PORT          optional   HTTP port (default: 8080)
# =====================================================================================
spring.application.name=safesphere-backend
server.port=${PORT:8080}

# Reads KEY=VALUE lines from backend/.env if that file exists (handy on Windows). Real environment
# variables always work too, and the file is optional.
spring.config.import=optional:file:./.env[.properties]

# ---- MySQL -----------------------------------------------------------------------
# useSSL=false is for LOCAL development only. Use TLS to a managed database in production.
# connectionTimeZone=UTC (+ forceConnectionTimeZoneToSession) makes the driver and the MySQL session use UTC. Together with
# UtcTimeZone.install() in main() every DATETIME holds true UTC (docs/TIMESTAMPS.md). A custom DB_URL should keep it.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safesphere?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:safesphere}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate -------------------------------------------------------------
# Flyway owns the schema, so Hibernate must not create or change tables.
spring.jpa.hibernate.ddl-auto=none
# Do not keep a database session open while the response is rendered (avoids hidden lazy queries).
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Flyway (database migrations) ------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT -------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
# URL-shaped on purpose (Spring Security reads "iss" as a URL). The .example domain is reserved and never resolves.
app.jwt.issuer=https://safesphere.example
app.jwt.expiration=${JWT_EXPIRATION:24h}

# ---- CORS ------------------------------------------------------------------------
# The Android app is not a browser, so it never needs CORS. Leave this empty unless a browser-based
# client is added later (comma-separated origins, for example http://localhost:5173).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---- Emergency locations (Phase 4A) ---------------------------------------------
# Most points one emergency may store, how long after it ends the phone may still upload points it
# recorded while it was active, and how far the phone's clock may be off from the server's.
app.emergency.locations.max-per-emergency=${EMERGENCY_LOCATION_LIMIT:1000}
app.emergency.locations.upload-grace=15m
app.emergency.locations.clock-tolerance=5m

# ---- Evidence Vault (Phase 5) ----------------------------------------------------
# Encrypted evidence files (ciphertext only) live in this folder, never in the database. Keep it out of git and
# include it in backups together with the database. EVIDENCE_VAULT_PUBLIC_KEY is the PUBLIC half of the offline
# vault recovery key (see docs/PHASE5.md, VaultKeyTool); empty = no escrow. The private half never goes here.
app.evidence.storage-dir=${EVIDENCE_STORAGE_DIR:evidence-store}
app.evidence.vault-public-key=${EVIDENCE_VAULT_PUBLIC_KEY:}
app.evidence.max-item-bytes=209715200
app.evidence.chunk-bytes=1048576
app.evidence.user-quota-bytes=2147483648
app.evidence.max-items-per-emergency=500
app.evidence.clock-tolerance=5m
# Deletion guard: not before 24 h after the emergency ended; 5 wrong passwords in 15 min lock deletion for 15 min.
app.evidence.delete-protection=24h
app.evidence.delete-max-failures=5
app.evidence.delete-failure-window=15m

# ---- Community Safety Intelligence (Phase 6, docs/PHASE6.md) -------------------
# A contribution starts counting a random 10-30 min later (protects the person who reported); new accounts count
# after 24 h. Daily limits per person, area look-up limits per hour, expired signals deleted every 15 minutes.
app.community.publish-delay-min=10m
app.community.publish-delay-max=30m
app.community.new-account-probation=24h
app.community.max-reports-per-day=10
app.community.max-contributions-per-day=30
app.community.max-reports-per-area-per-day=3
app.community.area-queries-per-hour=120
app.community.distinct-areas-per-hour=15
app.community.max-signals-per-area=100
app.community.purge-interval=PT15M
# Phase 7: at most 10 reports + answers + flags in any 10 minutes per person (scripted bursts).
app.community.writes-per-10-minutes=10

# ---- Verification, trust and moderation (Phase 7, docs/PHASE7.md) ---------------
# A removed signal stays a hidden tombstone for 30 days; closed cases are kept 90 days, the audit log 365 days.
app.moderation.removal-hold=30d
app.moderation.closed-case-retention=90d
app.moderation.audit-retention=365d
app.moderation.max-flags-per-day=10
app.moderation.moderator-requests-per-hour=600
app.moderation.page-size=50
# Phase 9C coord-1 (docs/PHASE9.md): finds groups whose support looks coordinated, for a HUMAN to review. OFF = Phase 7
# behaviour; SHADOW = only a count in the log (default, to see moderator workload first); ACTIVE = opens review cases.
# It never hides content or touches anyone. Reads every visible signal, so at most once per interval.
app.moderation.coordination.mode=SHADOW
app.moderation.coordination.interval=1h
app.moderation.coordination.max-cases-per-day=5

# ---- Safety Intelligence (Phase 8, docs/PHASE8_DESIGN.md) -----------------------
# Pattern memory: one decaying number per ~1 km area and group, fed only by finished, independently confirmed,
# unmoderated episodes (at most one per week); "recurring" from 2.5 (3 episodes); forgotten below 0.25.
# Turning it off deletes the remembered rows at the next clean-up.
app.intelligence.patterns-enabled=true
app.intelligence.pattern-half-life=60d
app.intelligence.pattern-cap=4
app.intelligence.pattern-recurring=2.5
app.intelligence.pattern-forget=0.25
app.intelligence.pattern-min-gap=7d
# Region packs for "Check the way" (Safe Walk): per person per 24 h, in memory only (no request is stored).
app.intelligence.region-requests-per-day=20
app.intelligence.region-distinct-per-day=6
app.intelligence.region-distinct-new-account=2
app.intelligence.region-max-signals=500
# Phase 9D (docs/PHASE9.md §19): the active rules are rules-1.1 (safe places alone never make an area look known).
# rules-2 ("take extra care" from two confirmed concerns needs three independent people) is a CANDIDATE: SHADOW = it is
# compared with rules-1.1 at most once per interval and only COUNTED in the log; ACTIVE = it decides what people see
# (only by the user's decision, see docs/PHASE9.md); OFF = not computed.
app.intelligence.rules-2-mode=SHADOW
app.intelligence.rules-2-shadow-interval=1h

# ---- Evaluation counters (Phase 9B, docs/PHASE9.md §27) -------------------------
# Weekly, system-wide outcome counts (no place, person, signal or time finer than a week) so the rules can be evaluated;
# read only by an ADMIN (GET /api/admin/evaluation). Rows are kept 104 weeks. Off = nothing counted and the stored rows
# are deleted at the next clean-up.
app.evaluation.enabled=true
app.evaluation.retention-weeks=104

# ---- Sign-in / sign-up abuse limits (Phase 7) -----------------------------------
# In memory only (no IP or e-mail is stored). Only FAILED sign-ins count. The network address is the TCP peer;
# behind a reverse proxy configure server.forward-headers-strategy for a TRUSTED proxy only.
app.auth.login-failures-per-account=10
app.auth.login-failures-per-address=30
app.auth.login-window=15m
app.auth.registrations-per-address=10
app.auth.registration-window=1h

# ---- Account security and deletion (Phase 10A, docs/PHASE10.md) ----------------
# Password change, deletion request and deletion cancel need the password: 5 wrong ones per 15 min per account -> 429
# (in memory). A deletion request waits 7 days (cancellable with the password; signing in does not cancel), is refused
# while an emergency is active or within 24 h after one, and the deletion itself also waits 24 h after any emergency.
# The deletion job runs every 15 minutes and removes the evidence files before the rows.
app.account.password-failures=5
app.account.password-failure-window=15m
app.account.deletion-grace=7d
app.account.deletion-protection=24h
app.account.deletion-batch=20
app.account.deletion-interval=PT15M

# ---- Time (UTC) ------------------------------------------------------------------
# At start-up the backend checks that a UTC value reaches the database unchanged and refuses to start if not.
app.time.verify-storage=true

# ---- Errors and logging ----------------------------------------------------------
# Never send exception messages or stack traces to clients. Our GlobalExceptionHandler builds the body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.root=INFO
logging.level.org.springframework.security=WARN
